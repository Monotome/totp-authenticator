name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (Windows .exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/ui
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache Nuitka Build
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: ${{ runner.os }}-nuitka-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Build with Nuitka
        working-directory: apps/ui
        run: |
          python -m nuitka --standalone --enable-plugin=tk-inter --windows-console-mode=disable --output-dir=dist --output-filename=totp-auth.exe --assume-yes-for-downloads src/totp_authenticator/main.py

      - name: Create ZIP archive
        working-directory: apps/ui
        run: |
          Compress-Archive -Path dist/main.dist/* -DestinationPath dist/TOTP-Authenticator-${{ github.ref_name }}-windows.zip

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: apps/ui/dist/TOTP-Authenticator-${{ github.ref_name }}-windows.zip

  build-mobile-android:
    name: Build Mobile (Android .apk)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build APK
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Prepare APK Artifact
        run: |
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk TOTP-Authenticator-${{ github.ref_name }}-android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: TOTP-Authenticator-${{ github.ref_name }}-android.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-mobile-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
