name: totp_authenticator
description: "TOTP Authenticator - Secure 2FA mobile app with E2EE Cloud Sync"
publish_to: 'none'
version: 0.8.2+7

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  otp: ^3.1.4
  http: ^1.4.0
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.0.2
  flutter_secure_storage: ^9.2.4
  local_auth: ^3.0.1
  google_fonts: ^6.2.1
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  local_auth_platform_interface: ^1.1.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0F19"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
